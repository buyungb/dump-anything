[package]
name = "dump-anything-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
mongodb = "3.6"
bson = { version = "2", features = ["chrono-0_4", "serde_with-3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
once_cell = "1"
regex = "1"
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
subtle = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
