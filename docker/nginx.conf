user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;
    keepalive_timeout 65;
    client_max_body_size 25m;

    gzip on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    upstream dump_api {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # Build redirect/Location URLs relative to the request, so they keep the
    # client-facing host:port instead of nginx's internal listen address.
    absolute_redirect off;
    port_in_redirect off;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;

        root /usr/share/nginx/html;
        index index.html;

        # Basic auth is server-wide. The include is generated at container
        # startup by docker/entrypoint.sh: it is empty when auth is disabled
        # and contains `auth_basic` + `auth_basic_user_file` when enabled.
        include /etc/nginx/auth.conf;

        # Health endpoint is always reachable without credentials so that
        # orchestrators (compose, k8s, load balancers) can probe the app.
        location = /health {
            auth_basic off;
            proxy_pass http://dump_api;
            proxy_set_header Host $host;
        }

        # The Rust API enforces its own X-API-Key gate (every /api/* request
        # must carry a valid key, hashed and revocable in the database). HTTP
        # basic auth would just be a second credential machines have to
        # juggle without adding meaningful security on top of the API key —
        # so /api/* is exempt from the server-wide basic-auth challenge.
        # Dashboard, dashboard assets, and the docs site still inherit basic
        # auth when DASHBOARD_USER/PASSWORD are set.
        location /api/ {
            auth_basic off;
            proxy_pass http://dump_api;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
            expires 7d;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        # Zudoku-powered API docs site, mounted at /docs/. The site is built
        # with `basePath: "/docs"` so all internal URLs are prefixed correctly.
        # Each page is pre-rendered as `<slug>.html`; fall through to that
        # before the SPA shell so direct/refresh links work without a flash.
        # Public — never gated, since docs aren't sensitive.
        location /docs/ {
            auth_basic off;
            try_files $uri $uri.html $uri/ /docs/index.html;
        }
        location = /docs {
            return 301 /docs/;
        }

        location / {
            try_files $uri /index.html;
        }
    }
}
